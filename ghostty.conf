# Catppuccin glass
theme = Catppuccin Mocha
background-opacity = 0.84
background-blur = 20
window-padding-x = 16
window-padding-y = 12
window-padding-balance = true
unfocused-split-opacity = 0.85
split-divider-color = #45475a

# Typography: keep your font and unambiguous, unjoined symbols.
font-family = Paper Mono
font-feature = calt
font-feature = ss01
font-size = 14
adjust-cell-height = 8%
# A steady block cursor, including at the shell prompt.
cursor-style = block
cursor-style-blink = false
cursor-invert-fg-bg = true
shell-integration = detect
shell-integration-features = no-cursor
macos-option-as-alt = left

# Windows and tabs
macos-titlebar-style = tabs
macos-titlebar-proxy-icon = hidden
window-decoration = true
window-save-state = always
confirm-close-surface = true
scrollbar = never
scrollback-limit = 25000000

# Mouse and clipboard
mouse-hide-while-typing = true
copy-on-select = clipboard
focus-follows-mouse = true
link-url = true
clipboard-paste-protection = true
clipboard-paste-bracketed-safe = true

# Notify only when a longer command finishes while you're elsewhere.
notify-on-command-finish = unfocused
notify-on-command-finish-after = 10s
notify-on-command-finish-action = no-bell,notify

# Dropdown terminal: Control + backtick, on the screen under the mouse.
quick-terminal-position = top
quick-terminal-size = 45%
quick-terminal-screen = mouse
quick-terminal-autohide = true
quick-terminal-animation-duration = 0.15
keybind = global:ctrl+grave_accent=toggle_quick_terminal

# Tabs
keybind = cmd+t=new_tab
keybind = cmd+shift+left=previous_tab
keybind = cmd+shift+right=next_tab
keybind = cmd+w=close_surface

# Create, focus, resize, and arrange splits.
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down
keybind = cmd+alt+left=goto_split:left
keybind = cmd+alt+right=goto_split:right
keybind = cmd+alt+up=goto_split:top
keybind = cmd+alt+down=goto_split:bottom
keybind = cmd+ctrl+left=resize_split:left,10
keybind = cmd+ctrl+right=resize_split:right,10
keybind = cmd+ctrl+up=resize_split:up,10
keybind = cmd+ctrl+down=resize_split:down,10
keybind = cmd+shift+e=equalize_splits
keybind = cmd+shift+f=toggle_split_zoom

# Search output and jump between prompts.
keybind = cmd+f=start_search
keybind = cmd+g=navigate_search:next
keybind = cmd+shift+g=navigate_search:previous
keybind = cmd+up=jump_to_prompt:-1
keybind = cmd+down=jump_to_prompt:1

# Font size
keybind = cmd+plus=increase_font_size:1
keybind = cmd+minus=decrease_font_size:1
keybind = cmd+zero=reset_font_size

# Configuration and command palette
keybind = cmd+comma=open_config
keybind = cmd+shift+comma=reload_config
keybind = cmd+shift+p=toggle_command_palette

auto-update = download
auto-update-channel = tip

# devclean
keybind = cmd+shift+backspace=text:devclean\r
